<html lang="ru">
<head>
  <meta charset="utf-8">

  <title>Автотесты — Формула</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 900px; padding: 24px; margin: auto; color: #18243b; }
    h1 { margin-bottom: 4px; } #summary { font-weight: 700; margin: 16px 0; }

  <h1>Автотесты «Формула»</h1>

  <div id="summary" role="status">Загрузка приложения…</div>
  <ol id="results"></ol>
  <iframe id="app" src="../index.html" title="Тестируемое приложение"></iframe>
